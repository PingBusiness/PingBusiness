# SPDX-License-Identifier: Apache-2.0
name: Validate merchant-store vibe kit

on:
  push:
    paths:
      - 'merchant-store-vibe-coding-kit/**'
      - '.github/workflows/merchant-store-vibe-kit-validate.yml'
  pull_request:
    paths:
      - 'merchant-store-vibe-coding-kit/**'
      - '.github/workflows/merchant-store-vibe-kit-validate.yml'

permissions:
  contents: read

env:
  KIT_DIR: merchant-store-vibe-coding-kit

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.2
      - working-directory: ${{ env.KIT_DIR }}
        run: ./scripts/validate.sh

  merchant-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: merchant-store-vibe-coding-kit/source/merchant-store/package-lock.json
      - working-directory: ${{ env.KIT_DIR }}/source/merchant-store
        run: npm ci --no-audit --no-fund
      - working-directory: ${{ env.KIT_DIR }}/source/merchant-store
        run: npm run build:prod
      - run: python3 $KIT_DIR/scripts/scan-frontend-secrets.py $KIT_DIR/source/merchant-store $KIT_DIR/source/merchant-store/dist
      - run: docker build -t pingbusiness/merchant-store:ci $KIT_DIR/source/merchant-store
      - run: docker build -t pingbusiness/estore-app:ci $KIT_DIR/source/estore-app
      - run: docker build -t pingbusiness/keycloak:ci $KIT_DIR/keycloak
      - run: docker build -t pingbusiness/keycloak-bootstrap:ci -f $KIT_DIR/keycloak/realm-bootstrap/Dockerfile $KIT_DIR/keycloak
      - run: docker build -t pingbusiness/edge:ci $KIT_DIR/deployment/edge

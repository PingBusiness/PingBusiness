<div class="toast-stack" aria-live="polite" aria-atomic="true">
  <div class="toast" *ngFor="let t of toasts$ | async" [ngClass]="t.type" role="status" (click)="dismiss(t.id)">
    <span class="toast-icon" [ngSwitch]="t.type">
      <svg *ngSwitchCase="'success'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 5-5.5"></path>
      </svg>
      <svg *ngSwitchCase="'error'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path>
      </svg>
      <svg *ngSwitchCase="'warning'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5 21 19H3z"></path><path d="M12 9.5v4"></path><path d="M12 16.5h.01"></path>
      </svg>
      <svg *ngSwitchCase="'processing'" class="toast-spinner" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 3a9 9 0 1 0 9 9" opacity=".9"></path>
      </svg>
      <svg *ngSwitchDefault viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path>
      </svg>
    </span>
    <div class="toast-copy">
      <p class="toast-title">{{ titleFor(t) }}</p>
      <p class="toast-msg">{{ t.message }}</p>
    </div>
  </div>
</div>

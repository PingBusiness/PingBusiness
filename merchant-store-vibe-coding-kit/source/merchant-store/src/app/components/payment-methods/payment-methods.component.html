<div class="pm-block">
  <div class="pm-text">
    <p class="pm-title">{{ title }}</p>
    <p *ngIf="description" class="pm-desc">{{ description }}</p>
  </div>

  <p *ngIf="loading" class="pm-desc">Loading available payment methods...</p>

  <div *ngIf="!loading && networks.length" class="pm-grid" role="radiogroup" [attr.aria-label]="title">
    <button *ngFor="let network of networks" type="button" class="pm-card"
      [class.selected]="selectable && selected === network"
      [class.disabled]="isDisabled(network)"
      [class.static]="!selectable"
      [disabled]="isDisabled(network)"
      [attr.role]="selectable ? 'radio' : null"
      [attr.aria-checked]="selectable ? (selected === network) : null"
      [attr.title]="isDisabled(network) ? disabledReason : null"
      (click)="choose(network)">
      <!-- Radio Button (design asset): ring + dot when selected, ring only otherwise. -->
      <svg *ngIf="selectable" class="pm-radio" viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path *ngIf="selected === network" fill="currentColor" d="M12 2C17.514 2 22 6.486 22 12C22 17.514 17.514 22 12 22C6.486 22 2 17.514 2 12C2 6.486 6.486 2 12 2ZM12 4C7.589 4 4 7.589 4 12C4.00003 16.411 7.58902 20 12 20C16.4109 19.9999 20 16.4109 20 12C20 7.58908 16.4109 4.00013 12 4ZM12 7C14.7569 7.00013 17 9.24308 17 12C17 14.7569 14.7569 16.9999 12 17C9.24302 17 7.00003 14.757 7 12C7 9.243 9.243 7 12 7Z"/>
        <path *ngIf="selected !== network" fill="currentColor" d="M12 2C17.514 2 22 6.486 22 12C22 17.514 17.514 22 12 22C6.486 22 2 17.514 2 12C2 6.486 6.486 2 12 2ZM12 3.04688C7.06334 3.04688 3.0459 7.06334 3.0459 12C3.04593 16.9366 7.06336 20.9531 12 20.9531C16.9365 20.953 20.9531 16.9366 20.9531 12C20.9531 7.06342 16.9366 3.04701 12 3.04688Z"/>
      </svg>
      <span class="pm-label">{{ label(network) }}</span>
    </button>
  </div>

  <p *ngIf="!loading && !networks.length" class="pm-desc">No payment methods are currently available for this merchant.</p>
</div>

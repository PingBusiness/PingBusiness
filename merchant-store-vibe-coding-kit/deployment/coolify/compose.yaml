# documentation: https://github.com/PingBusiness/PingBusiness/tree/main/merchant-store-vibe-coding-kit/deployment/coolify
# slogan: Ping Business merchant store stack for Coolify.
# tags: ecommerce,keycloak,postgres,pingbusiness
# port: 8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  keycloak:
    build:
      context: ../../keycloak
      dockerfile: Dockerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${STORE_DOMAIN:?STORE_DOMAIN is required}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE: local
      ESTORE_REALM: ${ESTORE_REALM:-ESTORE}
      ESTORE_CLIENT_ID: ${ESTORE_CLIENT_ID:-estore-app}
      ESTORE_CLIENT_SECRET: ${ESTORE_CLIENT_SECRET:?ESTORE_CLIENT_SECRET is required}
    healthcheck:
      # The Keycloak image ships no curl/wget, so probe the management port with
      # bash's /dev/tcp. Keep this as one shell level: nesting `bash -ec '...'`
      # here needs quote escaping that no longer parses once YAML folds the block.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "\"status\"[[:space:]]*:[[:space:]]*\"UP\"" <&3
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s

  keycloak-realm-bootstrap:
    build:
      context: ../../keycloak
      dockerfile: realm-bootstrap/Dockerfile
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_SERVER_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      ESTORE_REALM: ${ESTORE_REALM:-ESTORE}
      ESTORE_CLIENT_ID: ${ESTORE_CLIENT_ID:-estore-app}
      ESTORE_CLIENT_SECRET: ${ESTORE_CLIENT_SECRET:?ESTORE_CLIENT_SECRET is required}
      BOOTSTRAP_TIMEOUT_SECONDS: "600"
      VERIFY_TIMEOUT_SECONDS: "300"

  estore-app:
    build:
      context: ../../source/estore-app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      keycloak-realm-bootstrap:
        condition: service_completed_successfully
    environment:
      DEV_MODE: "false"
      ESTORE_APP_PORT: "5000"
      BIZ_APP_BASE_URL: ${BIZ_APP_BASE_URL:?BIZ_APP_BASE_URL is required}
      ESTORE_PUBLIC_BASE_URL: https://${STORE_DOMAIN:?STORE_DOMAIN is required}/api
      PINGBIZ_MERCHANT_IDENTIFIER: ${PINGBIZ_MERCHANT_IDENTIFIER:?PINGBIZ_MERCHANT_IDENTIFIER is required}
      PINGBIZ_STORE_IDENTIFIER: ${PINGBIZ_STORE_IDENTIFIER:?PINGBIZ_STORE_IDENTIFIER is required}
      PINGBIZ_MERCHANT_API_KEY: ${PINGBIZ_MERCHANT_API_KEY:?PINGBIZ_MERCHANT_API_KEY is required}
      ESTORE_KC_SERVER_URL: http://keycloak:8080
      ESTORE_REALM: ${ESTORE_REALM:-ESTORE}
      ESTORE_CLIENT_ID: ${ESTORE_CLIENT_ID:-estore-app}
      ESTORE_CLIENT_SECRET: ${ESTORE_CLIENT_SECRET:?ESTORE_CLIENT_SECRET is required}
      ESTORE_ALLOWED_ORIGINS: https://${STORE_DOMAIN:?STORE_DOMAIN is required}
      ESTORE_TRUST_PROXY_HEADERS: "true"
      ESTORE_CHECKOUT_FRAME_ANCESTORS: "'self'"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  merchant-store:
    build:
      context: ${MERCHANT_STORE_BUILD_CONTEXT:-../../source/merchant-store}
      dockerfile: ${MERCHANT_STORE_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    environment:
      ESTORE_APP_PUBLIC_URL: /api

  edge:
    build:
      context: ../edge
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      estore-app:
        condition: service_healthy
      merchant-store:
        condition: service_healthy
    environment:
      SERVICE_FQDN_EDGE_8080: https://${STORE_DOMAIN:?STORE_DOMAIN is required}
      STORE_ADDRESS: :8080
      PUBLIC_HOST: ${STORE_DOMAIN:?STORE_DOMAIN is required}
      PUBLIC_SCHEME: https
      PUBLIC_PORT: "443"
      ESTORE_APP_UPSTREAM: estore-app:5000
      KEYCLOAK_UPSTREAM: keycloak:8080
      MERCHANT_STORE_UPSTREAM: merchant-store:80
    expose:
      - "8080"

volumes:
  keycloak-postgres-data:
